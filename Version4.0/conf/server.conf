# Network
bind_ip=0.0.0.0
port=2000
thread_count=4
idle_timeout_seconds=30
max_file_size_bytes=10737418240

# Storage and TLS, paths are relative to Version4.0/server when starting ./server
storage_dir=../workspace
tls_certificate=../conf/server.crt
tls_private_key=../conf/server.key

# MySQL
db_host=127.0.0.1
db_port=3306
db_user=netdisk
db_password=netdisk_dev_password
db_name=Netdisk
